name: Build armeabi-v7a APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease -Pandroid.injected.build.abi=armeabi-v7a --no-daemon

      - name: Sign APK
        run: |
          # 1. Generate a temporary keystore
          keytool -genkey -v -keystore release.jks -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Nitterium, OU=Mobile, O=Fork, L=Unknown, S=Unknown, C=US"

          # 2. Locate Android build-tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          # 3. Locate the generated APK dynamically across the workspace
          UNSIGNED_APK=$(find . -type f -name "*.apk" ! -name "*signed*" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find . -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::No APK file found after Gradle build!"
            find . -type d -name "outputs"
            exit 1
          fi

          echo "Found APK to sign: $UNSIGNED_APK"

          # 4. Sign the APK
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Nitterium-armeabi-v7a.apk \
            "$UNSIGNED_APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nitterium-armeabi-v7a
          path: Nitterium-armeabi-v7a.apk
          if-no-files-found: error
