name: Build APK (minSdk 27)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and Sign APK
        run: |
          # 1. Generate temporary keystore
          keytool -genkey -v -keystore release.jks -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Nitterium, OU=Mobile, O=Fork, L=Unknown, S=Unknown, C=US"

          # 2. Locate Android build tools (zipalign & apksigner)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          # 3. Locate unsigned APK
          UNSIGNED_APK=$(find . -type f -name "*.apk" ! -name "*signed*" ! -name "*aligned*" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::No APK found after build!"
            exit 1
          fi
          echo "Found APK: $UNSIGNED_APK"

          # 4. ZipAlign the APK (Required for Android 8.1 / API 27)
          $BUILD_TOOLS_DIR/zipalign -f -p 4 "$UNSIGNED_APK" aligned-app.apk

          # 5. Sign with both v1 and v2 schemes
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out Nitterium-universal.apk \
            aligned-app.apk

          # 6. Verify the signature
          $BUILD_TOOLS_DIR/apksigner verify --verbose Nitterium-universal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nitterium-universal
          path: Nitterium-universal.apk
          if-no-files-found: error
